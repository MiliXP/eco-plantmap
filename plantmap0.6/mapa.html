<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantMapa</title>

    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/mapa.css">

    <style>
        /* ============================================================
           ESTILOS DOS BOTÕES (UI CONTROLS)
        ============================================================ */
        #btnVoltar {
            position: fixed;
            top: 20px;
            right: 80px; /* Ajustado para não sobrepor o dark mode */
            background: linear-gradient(135deg, #1b7925, #405138);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 20px;
            cursor: pointer;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        #toggleDark {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        /* ============================================================
           RESPONSIVIDADE (MOBILE)
        ============================================================ */
        @media (max-width: 600px) {
            #btnVoltar {
                width: 55px;
                height: 55px;
                padding: 0;
                border-radius: 50%;
                justify-content: center;
                right: 85px;
            }

            #btnVoltar .texto {
                display: none;
            }

            #btnVoltar .icone {
                font-size: 20px;
            }

            #toggleDark {
                right: 20px;
                top: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="controles-fixos">
        <button id="btnVoltar" title="Voltar para o Ranking">
            <span class="icone">⬅</span>
            <span class="texto">Ir para o Ranking</span>
        </button>

        <button id="toggleDark" title="Alternar Modo Escuro">🌙</button>
    </nav>

    <div class="container">

        <header class="main-header">
            <h1><span>Plant</span>Map</h1>
            <p>Visualização das áreas de plantio</p>
        </header>

        <main class="mapa-container">
            <article class="mapa-card">
                
                <header class="mapa-header">
                    <h2>🌍 Mapa de Plantio</h2>
                    <p>Acompanhe as regiões com maior número de mudas plantadas</p>
                </header>

                <div id="mapa">
                    <div class="placeholder-mapa">MAPA AQUI</div>
                </div>

                <footer class="mapa-info">
                    <div class="info-box">
                        <span>🌱 Total</span>
                        <strong>14.852</strong>
                    </div>

                    <div class="info-box">
                        <span>🌳 Área</span>
                        <strong>1200 m²</strong>
                    </div>

                    <div class="info-box">
                        <span>👥 Participantes</span>
                        <strong>84</strong>
                    </div>
                </footer>

            </article>
        </main>

    </div>

    <script>
        // Lógica de Navegação
        document.getElementById("btnVoltar").addEventListener("click", () => {
            window.location.href = "index.html";
        });

        // Lógica Dark Mode
        const toggle = document.getElementById("toggleDark");
        toggle.addEventListener("click", () => {
            document.body.classList.toggle("dark");
            // Troca o ícone dependendo do modo
            toggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
        });
    </script>

</body>
</html>
